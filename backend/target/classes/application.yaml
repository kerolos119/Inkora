server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: Inkora

  # Loads backend/.env if it exists (run the app from the backend folder)
  config:
    import: optional:file:.env[.properties]

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/Inkora}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:Inkora}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}

management:
  endpoints:
    web:
      exposure:
        include: "health,mappings"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: ${SWAGGER_ENABLED:true}

jwt:
  # No default on purpose: must come from .env or an environment variable
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}